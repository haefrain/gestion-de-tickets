# Sirve el build estático de la SPA (React/Vite). El edge (Caddy) hace TLS y enruta /api aparte;
# aquí sólo van las rutas del cliente, con fallback a index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida la resuelve el router del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML nunca se cachea, para que un deploy nuevo se vea al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
