; OPcache afinado para producción (entorno de pruebas).
; validate_timestamps=0: no se comprueba el mtime de cada archivo en cada request;
; el código se considera inmutable y se recarga sólo al desplegar una imagen nueva.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.preload_user=www-data
realpath_cache_size=4096K
realpath_cache_ttl=600
