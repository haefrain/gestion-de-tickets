# Despliegue al entorno de pruebas: construye las imágenes, las publica en GHCR y las despliega
# por SSH en la VM (docker compose). Manual (workflow_dispatch) o al publicar un tag vX.Y.Z.
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de imagen a desplegar"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api.prod
          - image: api-nginx
            dockerfile: docker/Dockerfile.api-nginx.prod
          - image: web
            dockerfile: docker/Dockerfile.web.prod
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.tag || 'latest' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Las entradas (tag, actor, token) viajan por env/envs, no interpoladas en el script,
      # para evitar inyección de comandos en el shell remoto.
      - name: Deploy por SSH (pull + up)
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd /opt/tickets
            git pull --ff-only
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
