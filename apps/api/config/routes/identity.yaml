# Rutas del contexto Identity (L1).

api_register:
    path: /api/v1/register
    controller: App\Identity\Infrastructure\Http\RegisterController
    methods: [POST]

api_login:
    path: /api/v1/login
    controller: App\Identity\Infrastructure\Http\LoginController
    methods: [POST]

api_token_refresh:
    path: /api/v1/token/refresh
    controller: App\Identity\Infrastructure\Http\RefreshTokenController
    methods: [POST]

api_logout:
    path: /api/v1/logout
    controller: App\Identity\Infrastructure\Http\LogoutController
    methods: [POST]

api_me_get:
    path: /api/v1/me
    controller: App\Identity\Infrastructure\Http\GetProfileController
    methods: [GET]

api_me_update:
    path: /api/v1/me
    controller: App\Identity\Infrastructure\Http\UpdateProfileController
    methods: [PATCH]

api_users_list:
    path: /api/v1/users
    controller: App\Identity\Infrastructure\Http\ListUsersController
    methods: [GET]

api_users_update:
    path: /api/v1/users/{id}
    controller: App\Identity\Infrastructure\Http\UpdateUserController
    methods: [PATCH]
    requirements:
        id: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
