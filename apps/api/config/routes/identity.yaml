# Rutas del contexto Identity (L1).

api_register:
    path: /api/v1/register
    controller: App\Identity\Infrastructure\Http\RegisterController
    methods: [POST]

api_login:
    path: /api/v1/login
    controller: App\Identity\Infrastructure\Http\LoginController
    methods: [POST]

api_token_refresh:
    path: /api/v1/token/refresh
    controller: App\Identity\Infrastructure\Http\RefreshTokenController
    methods: [POST]

api_logout:
    path: /api/v1/logout
    controller: App\Identity\Infrastructure\Http\LogoutController
    methods: [POST]

api_me_get:
    path: /api/v1/me
    controller: App\Identity\Infrastructure\Http\GetProfileController
    methods: [GET]

api_me_update:
    path: /api/v1/me
    controller: App\Identity\Infrastructure\Http\UpdateProfileController
    methods: [PATCH]
