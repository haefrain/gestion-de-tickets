framework:
    messenger:
        default_bus: command.bus
        buses:
            # Escritura: un handler obligatorio, en transacción Doctrine y con validación.
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            # Lectura: un handler obligatorio, devuelve resultado.
            query.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: false
            # Eventos de dominio: async vía RabbitMQ. El middleware de idempotencia (ADR 0008)
            # deduplica el consumo: un mensaje del outbox reentregado no se procesa dos veces.
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                middleware:
                    - App\Shared\Infrastructure\Messenger\IdempotentMessageMiddleware

        transports:
            # Transporte async para eventos de dominio (RabbitMQ, cola "indexing" del worker).
            # Reintentos con backoff exponencial (HU-L4-E1-02): 1s, 2s, 4s.
            async_events:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            # DLQ (dead-letter): agotados los reintentos, el mensaje se guarda aquí (HU-L4-E1-02).
            failed: 'doctrine://default?queue_name=failed'

        failure_transport: failed

        routing:
            # Todo evento de dominio (implementa DomainEvent) viaja async a RabbitMQ (HU-L4-E1-01).
            # El consumidor (Search\IndexTicketHandler) es idempotente: upsert por id en ES.
            'App\Shared\Domain\DomainEvent': async_events

when@test:
    framework:
        messenger:
            transports:
                async_events: 'in-memory://'
