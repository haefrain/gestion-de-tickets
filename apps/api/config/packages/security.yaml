security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # HU-L1-E2-01: jerarquía de roles. Cada rol hereda los permisos del anterior.
    role_hierarchy:
        ROLE_AGENT: ROLE_CLIENT
        ROLE_ADMIN: ROLE_AGENT

    providers:
        # Provider stateless: reconstruye el TokenUser desde los claims del JWT (HU-L1-E2-02).
        jwt:
            lexik_jwt:
                class: App\Identity\Infrastructure\Security\TokenUser

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            stateless: true
            provider: jwt
            # HU-L1-E2-02: autenticador JWT (Lexik, RS256). Valida el Bearer y carga roles del token.
            jwt: ~

    # Solo se aplica la *primera* regla que coincide. Públicas primero, luego el resto autenticado.
    access_control:
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/token/refresh, roles: PUBLIC_ACCESS }
        # Transiciones de estado: solo Agente/Admin (HU-L2-E1-05).
        - { path: '^/api/v1/tickets/[0-9a-f-]+/transitions$', roles: ROLE_AGENT, methods: [POST] }
        # Clasificación (prioridad/categoría) y asignación: solo Agente/Admin (HU-L2-E2-01, E2-02).
        - { path: '^/api/v1/tickets/[0-9a-f-]+$', roles: ROLE_AGENT, methods: [PATCH] }
        - { path: '^/api/v1/tickets/[0-9a-f-]+/assignment$', roles: ROLE_AGENT, methods: [POST] }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
