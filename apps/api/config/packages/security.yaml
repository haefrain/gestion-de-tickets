security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # HU-L1-E2-01: jerarquía de roles. Cada rol hereda los permisos del anterior.
    role_hierarchy:
        ROLE_AGENT: ROLE_CLIENT
        ROLE_ADMIN: ROLE_AGENT

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            stateless: true
            provider: users_in_memory
            # F2: sin autenticadores. El walking skeleton (/api/v1/health) es público.
            # El autenticador JWT (lexik, RS256) se activa en F6 con el contexto Identity (L1).

    # Solo se aplica la *primera* regla que coincide.
    access_control:
        - { path: ^/api/v1/health, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
