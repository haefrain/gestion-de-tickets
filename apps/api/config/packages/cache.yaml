framework:
    cache:
        # Namespace estable por entorno para las claves de cache.
        prefix_seed: 'iatsae/%kernel.environment%'
        default_redis_provider: '%env(REDIS_URL)%'

        # Pool dedicado de Ticketing sobre Redis con soporte de tags (L5-E1).
        pools:
            ticketing.cache:
                adapter: cache.adapter.redis
                tags: true
                default_lifetime: 300
            # Almacén del rate limiter de login sobre Redis (L5-E2).
            rate_limiter.cache:
                adapter: cache.adapter.redis

when@test:
    framework:
        cache:
            # En test el limiter usa un almacén en memoria: aislado por arranque de kernel,
            # no contamina otras pruebas (que rearrancan el kernel en cada request).
            pools:
                rate_limiter.cache:
                    adapter: cache.adapter.array
