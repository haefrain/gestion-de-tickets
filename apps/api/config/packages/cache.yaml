framework:
    cache:
        # Namespace estable por entorno para las claves de cache.
        prefix_seed: 'iatsae/%kernel.environment%'
        default_redis_provider: '%env(REDIS_URL)%'

        # Pool dedicado de Ticketing sobre Redis con soporte de tags (L5-E1).
        pools:
            ticketing.cache:
                adapter: cache.adapter.redis
                tags: true
                default_lifetime: 300
