# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Secure de la cookie de refresh (ADR 0006): off en dev (HTTP), on en prod (HTTPS).
    app.refresh_cookie_secure: false
    # Vida del refresh token (7 días): única fuente para la cookie y el store de Redis (ADR 0006).
    app.refresh_token_ttl: 604800

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Registra las clases de src/ como servicios (excluye el dominio puro y el Kernel).
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/'
            - '../src/Kernel.php'

    # ── Handlers -> bus correspondiente (sin atributos de Symfony en Application) ──
    _instanceof:
        App\Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        App\Shared\Application\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    # ── Controllers (servicios invocables, sin AbstractController) ──
    App\Shared\Infrastructure\Http\HealthController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\RegisterController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\LoginController:
        arguments:
            $loginLimiter: '@limiter.login'
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\RefreshTokenController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\LogoutController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\GetProfileController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\UpdateProfileController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\ListUsersController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\UpdateUserController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\CreateTicketController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\GetTicketController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\ListTicketsController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\TransitionController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\PatchTicketController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\AssignmentController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\AddCommentController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\ListCommentsController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\HistoryController:
        tags: ['controller.service_arguments']

    App\Search\Infrastructure\Http\SearchTicketsController:
        tags: ['controller.service_arguments']

    App\Shared\Infrastructure\Http\ReadinessController:
        arguments:
            $checks: !tagged_iterator app.health_check
        tags: ['controller.service_arguments']

    # ── Buses CQRS: cada adaptador envuelve su MessageBusInterface ──
    App\Shared\Infrastructure\Bus\MessengerCommandBus:
        arguments:
            $commandBus: '@command.bus'
    App\Shared\Infrastructure\Bus\MessengerQueryBus:
        arguments:
            $queryBus: '@query.bus'
    App\Shared\Infrastructure\Bus\MessengerEventBus:
        arguments:
            $eventBus: '@event.bus'

    # Relay del outbox (ADR 0008): despacha al event.bus, que enruta los eventos a async_events (RabbitMQ).
    App\Ticketing\Infrastructure\Outbox\RelayTicketingOutboxCommand:
        arguments:
            $eventBus: '@event.bus'

    # Puerto -> adaptador
    # Cache (L5): puerto -> adaptador Symfony Cache sobre el pool Redis con tags.
    App\Shared\Application\Cache\Cache: '@App\Shared\Infrastructure\Cache\SymfonyCache'
    App\Shared\Infrastructure\Cache\SymfonyCache:
        arguments:
            $cache: '@ticketing.cache'

    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\Bus\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\Bus\MessengerQueryBus'
    App\Shared\Application\Bus\EventBus: '@App\Shared\Infrastructure\Bus\MessengerEventBus'
    App\Shared\Application\Clock\Clock: '@App\Shared\Infrastructure\Clock\SystemClock'

    # ── Identity: puertos -> adaptadores ──
    App\Identity\Application\Port\UserRepository: '@App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'
    App\Identity\Application\Port\UserFinder: '@App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserFinder'
    App\Identity\Application\Port\PasswordHasher: '@App\Identity\Infrastructure\Security\SymfonyPasswordHasher'
    App\Identity\Application\Port\AccessTokenIssuer: '@App\Identity\Infrastructure\Security\LexikAccessTokenIssuer'
    App\Identity\Application\Port\RefreshTokenStore: '@App\Identity\Infrastructure\Security\RedisRefreshTokenStore'

    # ── Notifications (L4-E2): puertos -> adaptadores ──
    App\Notifications\Application\Port\Recipients: '@App\Notifications\Infrastructure\Persistence\Doctrine\DoctrineRecipients'
    App\Notifications\Application\Port\Notifier: '@App\Notifications\Infrastructure\Notifier\MailerNotifier'
    App\Notifications\Infrastructure\Notifier\MailerNotifier:
        arguments:
            $fromAddress: 'noreply@tickets.local'

    # ── Search (L3): puertos -> adaptadores ──
    # Índice de búsqueda sobre Elasticsearch; origen de (re)indexado sobre la tabla tickets.
    App\Search\Application\Port\SearchIndex: '@App\Search\Infrastructure\Elasticsearch\ElasticsearchIndex'
    App\Search\Infrastructure\Elasticsearch\ElasticsearchIndex:
        arguments:
            $baseUrl: '%env(ELASTICSEARCH_URL)%'
    App\Search\Application\Port\TicketReadModel: '@App\Search\Infrastructure\Persistence\Doctrine\DoctrineTicketReadModel'

    # ── Ticketing: puertos -> adaptadores ──
    App\Ticketing\Application\Port\TicketRepository: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineTicketRepository'
    # Outbox transaccional (ADR 0008): los casos de uso registran aquí los eventos de dominio.
    App\Ticketing\Application\Port\EventOutbox: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineEventOutbox'
    App\Ticketing\Application\Port\TicketFinder: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineTicketFinder'
    App\Ticketing\Application\Port\AgentDirectory: '@App\Ticketing\Infrastructure\Identity\DoctrineAgentDirectory'
    App\Ticketing\Application\Port\AssignmentStrategy: '@App\Ticketing\Infrastructure\Identity\LeastBusyAssignment'
    App\Ticketing\Application\Port\CommentRepository: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineCommentRepository'
    App\Ticketing\Application\Port\CommentFinder: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineCommentFinder'
    App\Ticketing\Application\Port\TicketHistoryRepository: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineTicketHistoryRepository'
    App\Ticketing\Application\Port\TicketHistoryFinder: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineTicketHistoryFinder'

    App\Identity\Infrastructure\Security\LexikAccessTokenIssuer:
        arguments:
            $ttl: 900

    App\Identity\Infrastructure\Http\RefreshTokenCookie:
        arguments:
            $secure: '%app.refresh_cookie_secure%'
            $ttlSeconds: '%app.refresh_token_ttl%'

    App\Identity\Infrastructure\Security\RedisRefreshTokenStore:
        arguments:
            $ttlSeconds: '%app.refresh_token_ttl%'

    # ── Readiness: adaptadores etiquetados para el tagged_iterator del ReadinessController ──
    App\Shared\Infrastructure\Health\PostgresHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\RedisHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\RabbitMqHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\ElasticsearchHealthCheck:
        arguments:
            $baseUrl: '%env(ELASTICSEARCH_URL)%'
        tags: ['app.health_check']

    # ── Conexiones de infraestructura usadas por los health checks de readiness ──
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    AMQPConnection:
        class: AMQPConnection
        arguments:
            -
                host: '%env(RABBITMQ_HOST)%'
                port: '%env(int:RABBITMQ_PORT)%'
                login: '%env(RABBITMQ_USER)%'
                password: '%env(RABBITMQ_PASSWORD)%'
                vhost: '%env(RABBITMQ_VHOST)%'

when@prod:
    parameters:
        app.refresh_cookie_secure: true
