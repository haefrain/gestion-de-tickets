# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Secure de la cookie de refresh (ADR 0006): off en dev (HTTP), on en prod (HTTPS).
    app.refresh_cookie_secure: false
    # Vida del refresh token (7 días): única fuente para la cookie y el store de Redis (ADR 0006).
    app.refresh_token_ttl: 604800

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Registra las clases de src/ como servicios (excluye el dominio puro y el Kernel).
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/'
            - '../src/Kernel.php'

    # ── Handlers -> bus correspondiente (sin atributos de Symfony en Application) ──
    _instanceof:
        App\Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        App\Shared\Application\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    # ── Controllers (servicios invocables, sin AbstractController) ──
    App\Shared\Infrastructure\Http\HealthController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\RegisterController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\LoginController:
        tags: ['controller.service_arguments']

    App\Identity\Infrastructure\Http\RefreshTokenController:
        tags: ['controller.service_arguments']

    App\Ticketing\Infrastructure\Http\CreateTicketController:
        tags: ['controller.service_arguments']

    App\Shared\Infrastructure\Http\ReadinessController:
        arguments:
            $checks: !tagged_iterator app.health_check
        tags: ['controller.service_arguments']

    # ── Buses CQRS: cada adaptador envuelve su MessageBusInterface ──
    App\Shared\Infrastructure\Bus\MessengerCommandBus:
        arguments:
            $commandBus: '@command.bus'
    App\Shared\Infrastructure\Bus\MessengerQueryBus:
        arguments:
            $queryBus: '@query.bus'
    App\Shared\Infrastructure\Bus\MessengerEventBus:
        arguments:
            $eventBus: '@event.bus'

    # Puerto -> adaptador
    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\Bus\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\Bus\MessengerQueryBus'
    App\Shared\Application\Bus\EventBus: '@App\Shared\Infrastructure\Bus\MessengerEventBus'
    App\Shared\Application\Clock\Clock: '@App\Shared\Infrastructure\Clock\SystemClock'

    # ── Identity: puertos -> adaptadores ──
    App\Identity\Application\Port\UserRepository: '@App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'
    App\Identity\Application\Port\PasswordHasher: '@App\Identity\Infrastructure\Security\SymfonyPasswordHasher'
    App\Identity\Application\Port\AccessTokenIssuer: '@App\Identity\Infrastructure\Security\LexikAccessTokenIssuer'
    App\Identity\Application\Port\RefreshTokenStore: '@App\Identity\Infrastructure\Security\RedisRefreshTokenStore'

    # ── Ticketing: puertos -> adaptadores ──
    App\Ticketing\Application\Port\TicketRepository: '@App\Ticketing\Infrastructure\Persistence\Doctrine\DoctrineTicketRepository'

    App\Identity\Infrastructure\Security\LexikAccessTokenIssuer:
        arguments:
            $ttl: 900

    App\Identity\Infrastructure\Http\RefreshTokenCookie:
        arguments:
            $secure: '%app.refresh_cookie_secure%'
            $ttlSeconds: '%app.refresh_token_ttl%'

    App\Identity\Infrastructure\Security\RedisRefreshTokenStore:
        arguments:
            $ttlSeconds: '%app.refresh_token_ttl%'

    # ── Readiness: adaptadores etiquetados para el tagged_iterator del ReadinessController ──
    App\Shared\Infrastructure\Health\PostgresHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\RedisHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\RabbitMqHealthCheck:
        tags: ['app.health_check']
    App\Shared\Infrastructure\Health\ElasticsearchHealthCheck:
        arguments:
            $baseUrl: '%env(ELASTICSEARCH_URL)%'
        tags: ['app.health_check']

    # ── Conexiones de infraestructura usadas por los health checks de readiness ──
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    AMQPConnection:
        class: AMQPConnection
        arguments:
            -
                host: '%env(RABBITMQ_HOST)%'
                port: '%env(int:RABBITMQ_PORT)%'
                login: '%env(RABBITMQ_USER)%'
                password: '%env(RABBITMQ_PASSWORD)%'
                vhost: '%env(RABBITMQ_VHOST)%'

when@prod:
    parameters:
        app.refresh_cookie_secure: true
